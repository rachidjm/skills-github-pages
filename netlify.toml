# Netlify: sirve el bot (carpeta sniper-lab) y el intermediario de X (la clave nunca llega al navegador)
[build]
  publish = "sniper-lab"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/x"
  to = "/.netlify/functions/x"
  status = 200

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
